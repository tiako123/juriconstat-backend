# ============================================================
# JuriConstat Backend - Configuration H2 (Développement)
# Pour utiliser : ajouter --spring.profiles.active=dev au démarrage
# ============================================================

# ----- Base de données SQLite permanente -----
spring.datasource.url=jdbc:sqlite:juriconstat.db?journal_mode=WAL&busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-timeout=30000

# ----- JPA -----
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ----- Logs -----
logging.level.com.juriconstat=DEBUG
logging.level.org.springframework.security=DEBUG

# ----- JWT (dev) -----
jwt.secret=juriconstat_super_secret_key_that_is_at_least_256_bits_long_for_security
jwt.expiration-ms=86400000

# ----- API Gemini IA (dev) -----
# Remplacer VOTRE_CLE_API_ICI par ta vraie clé dans application-local.properties
gemini.api.key=${GEMINI_API_KEY:AIzaSyBI2zoFum1vXae23ngwC6aXlWg3ifzYJe0}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent

# ----- Limites de taille pour l'envoi de médias (Base64) -----
server.tomcat.max-swallow-size=50MB
server.tomcat.max-http-form-post-size=50MB
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

