# ============================================================
# JuriConstat Backend - Configuration H2 (Développement)
# Pour utiliser : ajouter --spring.profiles.active=dev au démarrage
# ============================================================

# ----- Base de données H2 en mémoire -----
spring.datasource.url=jdbc:h2:mem:juriconstatdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ----- Console H2 (accessible sur http://localhost:8080/api/h2-console) -----
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ----- JPA -----
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# ----- Logs -----
logging.level.com.juriconstat=DEBUG
logging.level.org.springframework.security=DEBUG

# ----- JWT (dev) -----
jwt.secret=juriconstat_super_secret_key_that_is_at_least_256_bits_long_for_security
jwt.expiration-ms=86400000

# ----- API Gemini IA (dev) -----
# Remplacer VOTRE_CLE_API_ICI par ta vraie clé dans application-local.properties
gemini.api.key=${GEMINI_API_KEY:VOTRE_CLE_API_ICI}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent

