# ============================================================
# JuriConstat Backend - Configuration PostgreSQL (Production)
# ============================================================
spring.application.name=juriconstat-backend

# ----- Base de données PostgreSQL -----
spring.datasource.url=jdbc:postgresql://localhost:5432/juriconstat_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ----- JPA / Hibernate -----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ----- Serveur -----
server.port=8085
server.servlet.context-path=/api

# ----- JWT (à changer en production !) -----
jwt.secret=juriconstat_super_secret_key_that_is_at_least_256_bits_long_for_security
jwt.expiration-ms=86400000

# ----- API Gemini IA -----
# Remplacer par ta vraie clé depuis : https://aistudio.google.com/app/apikey
gemini.api.key=${GEMINI_API_KEY:AIzaSyBI2zoFum1vXae23ngwC6aXlWg3ifzYJe0}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent

# ----- Logs -----
logging.level.com.juriconstat=DEBUG
logging.level.org.springframework.security=INFO

# ----- Groupes de Profils -----
# Activer le profil 'dev' va automatiquement charger le profil 'local' non versionné
spring.profiles.group.dev=local

